version: 0.2

# Estágio Validate do pipeline (seção 15/16 do prompt mestre). Falha o pipeline em
# qualquer erro de lint/typecheck/teste/build — nada é implantado se esta etapa falhar.
# Nunca executado neste sandbox (sem credenciais AWS reais e sem CodeConnection
# autorizada); validado apenas por revisão e pelos mesmos comandos rodando localmente
# (17/17 lint, 17/17 typecheck, 35/35 testes, 10/10 build neste ambiente).
#
# Usa Postgres/Redis efêmeros no próprio runner do CodeBuild — nunca o RDS/Redis reais
# de DEV (seção 12 do prompt mestre: nunca testar contra dados reais).

env:
  variables:
    DATABASE_URL: "postgresql://selecon:selecon@localhost:5432/selecon_test"
    REDIS_URL: "redis://localhost:6379"
    NODE_ENV: "test"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - set -euo pipefail
      - corepack enable
      - corepack prepare pnpm@10 --activate
      - apt-get update -y && apt-get install -y postgresql redis-server
      - service postgresql start
      - service redis-server start || redis-server --daemonize yes
      - until pg_isready -h localhost -p 5432; do sleep 1; done
      - sudo -u postgres psql -c "CREATE USER selecon WITH PASSWORD 'selecon' SUPERUSER;"
      - sudo -u postgres psql -c "CREATE DATABASE selecon_test OWNER selecon;"

  build:
    commands:
      - set -euo pipefail
      - pnpm install --frozen-lockfile
      - pnpm format
      - pnpm lint
      - pnpm typecheck
      - pnpm --filter @selecon/db exec prisma migrate deploy
      - pnpm test
      - pnpm build
      - pnpm audit --audit-level=critical || echo "Auditoria de dependências: ver achados acima (não bloqueia DEV; revisar antes de promover para HML/PRD)"
