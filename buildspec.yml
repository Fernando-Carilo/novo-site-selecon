version: 0.2

# Buildspec único do Portal Selecon (DEV) — GitHub -> CodePipeline -> CodeBuild ->
# Elastic Beanstalk (Docker, container único). O CodeBuild usa a imagem gerenciada
# "aws/codebuild/amazonlinux2-x86_64-standard:5.0" (Amazon Linux 2) — NUNCA usar
# apt-get/apt aqui (não existe nessa imagem; é yum/dnf). Todo o build real da
# aplicação (pnpm install, lint/typecheck/test, build, Prisma Client) já acontece
# DENTRO do Dockerfile (multi-stage) — o CodeBuild só autentica no ECR, builda a
# imagem Docker, publica no ECR e gera o pacote de implantação do Elastic Beanstalk
# (Dockerrun.aws.json). Isso elimina a necessidade de instalar Node/pnpm/Postgres
# diretamente no runner do CodeBuild.
#
# Variáveis já fornecidas pelo projeto CodeBuild (ver
# infrastructure/cloudformation/pipeline.yml): AWS_ACCOUNT_ID, AWS_DEFAULT_REGION,
# ECR_REPOSITORY_URI, CONTAINER_PORT.
#
# Nunca executado neste sandbox (sem credenciais AWS reais, sem acesso a registry
# Docker — ver docs/ASSUMPTIONS.md).

env:
  shell: bash

phases:
  pre_build:
    commands:
      - echo "Autenticando no Amazon ECR"
      - IMAGE_TAG="$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual}" | cut -c1-12)"
      - test -n "$IMAGE_TAG"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

  build:
    commands:
      - echo "Construindo imagem ${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
      - docker build --pull -f Dockerfile -t "${ECR_REPOSITORY_URI}:${IMAGE_TAG}" .
      - docker tag "${ECR_REPOSITORY_URI}:${IMAGE_TAG}" "${ECR_REPOSITORY_URI}:latest"

  post_build:
    commands:
      - docker push "${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
      - docker push "${ECR_REPOSITORY_URI}:latest"
      - |
        cat > Dockerrun.aws.json <<EOF
        {
          "AWSEBDockerrunVersion": "1",
          "Image": {
            "Name": "${ECR_REPOSITORY_URI}:${IMAGE_TAG}",
            "Update": "true"
          },
          "Ports": [
            {
              "ContainerPort": "${CONTAINER_PORT:-3000}"
            }
          ]
        }
        EOF
      - cat Dockerrun.aws.json

artifacts:
  files:
    - Dockerrun.aws.json
  discard-paths: yes
