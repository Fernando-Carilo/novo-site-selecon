version: 0.2

# Executa em cada push à branch de DEV (via CodePipeline/CodeBuild — ver
# infrastructure/cdk/lib/pipeline-stack.ts). Nunca executado neste sandbox: exige
# credenciais AWS reais e a CodeConnection do GitHub autorizada manualmente (bloqueio
# real, seção 34 do prompt mestre). Validado apenas por leitura/revisão.

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - corepack enable
      - corepack prepare pnpm@10 --activate

  pre_build:
    commands:
      - pnpm install --frozen-lockfile
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"

  build:
    commands:
      - pnpm lint
      - pnpm typecheck
      - pnpm test
      - pnpm build
      - docker build --platform linux/amd64 -f apps/web/Dockerfile -t "$WEB_REPOSITORY_URI:$IMAGE_TAG" -t "$WEB_REPOSITORY_URI:dev" .
      - docker build --platform linux/amd64 -f apps/api/Dockerfile -t "$API_REPOSITORY_URI:$IMAGE_TAG" -t "$API_REPOSITORY_URI:dev" .
      - docker build --platform linux/amd64 -f apps/worker/Dockerfile -t "$WORKER_REPOSITORY_URI:$IMAGE_TAG" -t "$WORKER_REPOSITORY_URI:dev" .
      - docker push "$WEB_REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$WEB_REPOSITORY_URI:dev"
      - docker push "$API_REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$API_REPOSITORY_URI:dev"
      - docker push "$WORKER_REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$WORKER_REPOSITORY_URI:dev"
      # Migração — etapa única e controlada, nunca em cada réplica da API (seção 24).
      # Usa a mesma imagem da API recém-construída para garantir que o schema aplicado
      # corresponde exatamente ao código implantado.
      - docker run --rm -e DATABASE_URL="$DATABASE_URL" "$API_REPOSITORY_URI:$IMAGE_TAG" node_modules/.bin/prisma migrate deploy --schema packages/db/prisma/schema.prisma

  post_build:
    commands:
      - aws ecs update-service --cluster "$ECS_CLUSTER_NAME" --service selecon-portal-dev-web --force-new-deployment
      - aws ecs update-service --cluster "$ECS_CLUSTER_NAME" --service selecon-portal-dev-api --force-new-deployment
      - aws ecs update-service --cluster "$ECS_CLUSTER_NAME" --service selecon-portal-dev-worker --force-new-deployment
      - aws ecs wait services-stable --cluster "$ECS_CLUSTER_NAME" --services selecon-portal-dev-web selecon-portal-dev-api selecon-portal-dev-worker

artifacts:
  files:
    - "**/*"
  base-directory: "."
