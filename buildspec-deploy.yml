version: 0.2

# Estágio Deploy do pipeline — roda LOGO APÓS BuildImages e ANTES de Migrations
# (Source -> Validate -> BuildImages -> Deploy -> Migrations -> SmokeTest). synth/diff/
# deploy de SeleconPortalDevStack (a ÚNICA stack que este buildspec jamais toca; não
# existe nem uma referência a um ambiente de PRD neste repositório) e atualização do
# serviço web existente (não gerenciado pelo CDK). Nunca executado neste sandbox (sem
# credenciais AWS reais).
#
# Por que Deploy vem antes de Migrations: no primeiro run da pipeline,
# SeleconPortalDevStack ainda não existe — é este estágio que a cria. O passo seguinte
# (Migrations) exige que a stack e o serviço da api já existam e estejam ACTIVE — ver
# buildspec-migrations.yml, que agora FALHA (nunca pula) se não existirem. O
# `post_build` abaixo espera os 3 serviços atingirem steady state antes de passar
# adiante; isso não depende de nenhuma migração já aplicada, porque o health check
# `/api/health/ready` só testa `SELECT 1` (ver apps/api/src/health/health.service.ts).
#
# Rollback em falha de implantação do ECS é feito pelo circuit breaker de deployment do
# próprio serviço (deploymentCircuitBreaker: { enable: true, rollback: true } em
# infrastructure/cdk/lib/selecon-portal-stack.ts). Rollback manual entre revisões de
# task definition: scripts/rollback-ecs-dev.sh (nunca desfaz migrações de banco
# automaticamente).

env:
  variables:
    STACK_NAME: "SeleconPortalDevStack"
    ALB_NAME: "selecon-portal-dev-alb"
    WEB_SERVICE_NAME: "selecon-portal-dev-web"
    API_SERVICE_NAME: "selecon-portal-dev-api"
    WORKER_SERVICE_NAME: "selecon-portal-dev-worker"

phases:
  pre_build:
    commands:
      - set -euo pipefail
      - export IMAGE_TAG=$(node -pe "require('./image-tag.json').imageTag")
      - 'echo "Implantando commit/tag de imagem: $IMAGE_TAG"'
      - corepack enable
      - corepack prepare pnpm@10 --activate
      - cd infrastructure/cdk && pnpm install --ignore-workspace --frozen-lockfile && cd "$CODEBUILD_SRC_DIR"
      - |
        ALB_ARN=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --query 'LoadBalancers[0].LoadBalancerArn' --output text)
        [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ] || { echo "ALB $ALB_NAME não encontrado."; exit 1; }
        LISTENER_ARN=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" --query 'Listeners[?Port==`80`].ListenerArn | [0]' --output text)
        [ -n "$LISTENER_ARN" ] && [ "$LISTENER_ARN" != "None" ] || { echo "Listener HTTP:80 não encontrado no ALB $ALB_NAME."; exit 1; }
        echo "export LISTENER_ARN=$LISTENER_ARN" >> /tmp/deploy-env.sh

  build:
    commands:
      - set -euo pipefail
      - source /tmp/deploy-env.sh
      - export CDK_CONTEXT_ARGS="-c imageTag=$IMAGE_TAG -c albListenerArn=$LISTENER_ARN"

      # --- cdk synth ---
      - |
        (cd infrastructure/cdk && npx cdk synth "$STACK_NAME" $CDK_CONTEXT_ARGS) > cdk-synth.log 2>&1 \
          || { cat cdk-synth.log; echo "cdk synth falhou."; exit 1; }

      # --- cdk diff + validação de segurança: nunca prossiga se houver sinal de
      # substituição/remoção de VPC, ALB, cluster ECS ou do serviço web existente. Este
      # stack só REFERENCIA esses recursos (fromVpcAttributes/fromClusterAttributes/
      # SecurityGroup.fromSecurityGroupId) — nunca deveria haver diff destrutivo neles. ---
      - |
        (cd infrastructure/cdk && npx cdk diff "$STACK_NAME" $CDK_CONTEXT_ARGS) > cdk-diff.log 2>&1
        DIFF_EXIT=$?
        cat cdk-diff.log
        if [ "$DIFF_EXIT" -ne 0 ]; then
          echo "cdk diff falhou (erro real, não apenas diferenças) — corrija a causa raiz."
          exit 1
        fi
      - |
        DESTRUCTIVE=0
        if grep -qE '\[-\].*(AWS::EC2::VPC[^L[:alnum:]]|AWS::ElasticLoadBalancingV2::LoadBalancer|AWS::ECS::Cluster[^C])' cdk-diff.log; then
          echo "AVISO: o diff mostra REMOÇÃO de VPC, ALB ou cluster — isso nunca deveria acontecer."
          DESTRUCTIVE=1
        fi
        if grep -qi "Replacement" cdk-diff.log; then
          echo "AVISO: o diff contém ao menos uma substituição de recurso (\"Replacement\")."
          DESTRUCTIVE=1
        fi
        if grep -qiE '(replace|destroy)' cdk-diff.log && grep -qi "selecon-portal-dev-web" cdk-diff.log; then
          echo "AVISO: o diff menciona o serviço web existente junto de uma possível substituição/destruição."
          DESTRUCTIVE=1
        fi
        if [ "$DESTRUCTIVE" -eq 1 ]; then
          echo "PARANDO — risco de substituição/remoção destrutiva detectado no diff acima. Revise manualmente."
          exit 1
        fi
        echo "Diff revisado automaticamente — nenhum sinal de substituição/remoção destrutiva."

      # --- cdk deploy — SOMENTE SeleconPortalDevStack; nunca nenhuma stack de PRD (não
      # existe referência a uma no código deste repositório). Cria/atualiza RDS, Redis,
      # S3 e os serviços api/worker (gerenciados pelo CDK) apontando para a tag imutável
      # do commit atual. Nunca recria VPC/ALB/cluster/serviço web (só referenciados). ---
      - |
        (cd infrastructure/cdk && npx cdk deploy "$STACK_NAME" $CDK_CONTEXT_ARGS --require-approval never) || {
          echo "cdk deploy falhou ou sofreu rollback:"
          aws cloudformation describe-stack-events --stack-name "$STACK_NAME" \
            --query 'StackEvents[?contains(ResourceStatus, `FAILED`)].{resource:LogicalResourceId,status:ResourceStatus,reason:ResourceStatusReason}' \
            --output table
          exit 1
        }

      - |
        API_INTERNAL_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
          --query "Stacks[0].Outputs[?OutputKey=='ApiInternalUrl'].OutputValue | [0]" --output text)

        # --- Atualiza o serviço web existente (não gerenciado pelo CDK) para a imagem
        # do commit atual. Nunca presume que a família da task definition é igual ao
        # nome do serviço — descobre pelo describe-services. ---
        CURRENT_WEB_TASK_DEF_ARN=$(aws ecs describe-services --cluster "$ECS_CLUSTER_NAME" --services "$WEB_SERVICE_NAME" \
          --query 'services[0].taskDefinition' --output text)
        [ -n "$CURRENT_WEB_TASK_DEF_ARN" ] && [ "$CURRENT_WEB_TASK_DEF_ARN" != "None" ] \
          || { echo "Não foi possível descobrir a task definition atual do serviço $WEB_SERVICE_NAME."; exit 1; }

        CURRENT_WEB_TASK_DEF=$(aws ecs describe-task-definition --task-definition "$CURRENT_WEB_TASK_DEF_ARN" \
          --include TAGS --query '{taskDefinition: taskDefinition, tags: tags}')
        CURRENT_WEB_TAGS=$(echo "$CURRENT_WEB_TASK_DEF" | jq '.tags // []')

        # Preserva TODAS as propriedades atuais da task definition (volumes, tags,
        # ephemeralStorage etc.) — remove só os campos imutáveis que
        # describe-task-definition devolve mas register-task-definition rejeita.
        NEW_WEB_TASK_DEF=$(echo "$CURRENT_WEB_TASK_DEF" | jq \
          --arg IMAGE "$WEB_REPOSITORY_URI:$IMAGE_TAG" --arg API_URL "$API_INTERNAL_URL" --argjson TAGS "$CURRENT_WEB_TAGS" '
            .taskDefinition as $td
            | $td
            | .containerDefinitions = ($td.containerDefinitions | map(
                .image = $IMAGE
                | .environment = ((.environment // []) | map(select(.name != "API_INTERNAL_URL")) + [{name: "API_INTERNAL_URL", value: $API_URL}])
              ))
            | (if ($TAGS | length) > 0 then .tags = $TAGS else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ')
        echo "$NEW_WEB_TASK_DEF" > web-task-def.json
        NEW_WEB_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://web-task-def.json \
          --query 'taskDefinition.taskDefinitionArn' --output text)
        echo "Nova task definition do serviço web: $NEW_WEB_TASK_DEF_ARN"

        aws ecs update-service --cluster "$ECS_CLUSTER_NAME" --service "$WEB_SERVICE_NAME" \
          --task-definition "$NEW_WEB_TASK_DEF_ARN" --force-new-deployment >/dev/null
        echo "Serviço $WEB_SERVICE_NAME atualizado."

  post_build:
    commands:
      - set -euo pipefail
      - |
        aws ecs wait services-stable --cluster "$ECS_CLUSTER_NAME" \
          --services "$WEB_SERVICE_NAME" "$API_SERVICE_NAME" "$WORKER_SERVICE_NAME" \
          || echo "AVISO: 'wait services-stable' expirou — checando estado real a seguir."
      - |
        UNHEALTHY=0
        for SERVICE in "$WEB_SERVICE_NAME" "$API_SERVICE_NAME" "$WORKER_SERVICE_NAME"; do
          INFO=$(aws ecs describe-services --cluster "$ECS_CLUSTER_NAME" --services "$SERVICE" \
            --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount}')
          echo "$SERVICE: $INFO"
          DESIRED=$(echo "$INFO" | jq -r '.desired')
          RUNNING=$(echo "$INFO" | jq -r '.running')
          PENDING=$(echo "$INFO" | jq -r '.pending')
          if [ "$RUNNING" != "$DESIRED" ] || [ "$PENDING" != "0" ]; then
            echo "$SERVICE fora do steady state (desired=$DESIRED running=$RUNNING pending=$PENDING)"
            UNHEALTHY=1
          fi
        done
        if [ "$UNHEALTHY" -eq 1 ]; then
          echo "Um ou mais serviços ECS não estão em steady state — falhando o estágio."
          exit 1
        fi
        echo "Todos os serviços em steady state."
