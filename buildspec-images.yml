version: 0.2

# Estágio BuildImages do pipeline (seção 15/16/22). Constrói e publica as três imagens
# com tag imutável = commit SHA, além de atualizar a tag de conveniência "dev". Nunca
# executado neste sandbox — sem credenciais AWS reais e sem acesso ao Docker Hub via
# política de rede do ambiente (ver blocker report; instrução do solicitante: não
# repetir o bloqueio, apenas registrado aqui para quem for revisar o código).

env:
  variables:
    IMAGE_TAG: "" # preenchido em pre_build a partir de CODEBUILD_RESOLVED_SOURCE_VERSION

phases:
  pre_build:
    commands:
      - set -euo pipefail
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:12}"
      - echo "Construindo imagens para o commit $IMAGE_TAG"

  build:
    commands:
      - set -euo pipefail
      - docker build --platform linux/amd64 -f apps/web/Dockerfile -t "$WEB_REPOSITORY_URI:$IMAGE_TAG" -t "$WEB_REPOSITORY_URI:dev" .
      - docker build --platform linux/amd64 -f apps/api/Dockerfile -t "$API_REPOSITORY_URI:$IMAGE_TAG" -t "$API_REPOSITORY_URI:dev" .
      - docker build --platform linux/amd64 -f apps/worker/Dockerfile -t "$WORKER_REPOSITORY_URI:$IMAGE_TAG" -t "$WORKER_REPOSITORY_URI:dev" .

  post_build:
    commands:
      - set -euo pipefail
      - docker push "$WEB_REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$WEB_REPOSITORY_URI:dev"
      - docker push "$API_REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$API_REPOSITORY_URI:dev"
      - docker push "$WORKER_REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$WORKER_REPOSITORY_URI:dev"
      # Artefato consumido pelos estágios seguintes (Migrations/Deploy) — evita
      # recalcular a tag e garante que todos os estágios implantam a mesma imagem.
      - printf '{"imageTag":"%s"}' "$IMAGE_TAG" > image-tag.json

artifacts:
  files:
    - image-tag.json
